name: Seite bauen und hochladen

on:
  push:
    branches: [main]
  schedule:
    # am 3. jedes Monats um 4:17 Uhr UTC - ungerade Zeit, damit der Lauf
    # nicht mit tausend anderen gleichzeitig bei Overpass anklopft
    - cron: '17 4 3 * *'
  workflow_dispatch:
    inputs:
      rohdaten_neu:
        description: 'Rohdaten neu von Overpass holen'
        type: boolean
        default: false

concurrency:
  group: bau
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Rohdaten holen
        # Beim Push nur, was veraltet ist. Beim Monatslauf und auf Knopfdruck alles.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.rohdaten_neu }}" = "true" ]; then
            npm run hole -- --alle
          else
            npm run hole
          fi

      - name: Seite bauen
        run: npm run bau

      - name: Rohdaten zurückschreiben
        # Damit ein späterer Build ohne Netz dasselbe Ergebnis liefert
        # und man im Verlauf sieht, was sich in OSM geändert hat.
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain roh daten)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add roh daten
            git commit -m 'Rohdaten und Datensätze aktualisiert'
            git push
          else
            echo 'Keine Änderungen an den Rohdaten.'
          fi

      - name: Hochladen
        if: github.ref == 'refs/heads/main'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_ZIEL: ${{ vars.FTP_ZIEL || '/essen' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
            mirror --reverse --only-newer --verbose --exclude-glob .git* web/ '$FTP_ZIEL/';
          "
